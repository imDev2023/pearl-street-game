[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

# Robinhood Chain is Arbitrum Nitro: never use block.number for game logic
# (use ArbSys(0x64).arbBlockNumber() or timestamps), and there is no VRF -
# randomness is commit-reveal only. See docs/reference/ROBINHOOD-CHAIN.md.

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Blockscout verification (no API key needed; pass any non-empty key).
# forge script ... --verify --verifier blockscout --verifier-url <url below>
[etherscan]
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
robinhood_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
